<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="1000" height="600">
	<!-- Neutral demo badge for the "On a car" view (the builder loads <assetsUrl>img/pb-car-badge.svg). Replace with each shop's own badge. -->
	<defs>
		<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f4f5f6"/>
			<stop offset="0.5" stop-color="#8d939a"/>
			<stop offset="1" stop-color="#e6e8ea"/>
		</linearGradient>
	</defs>
	<ellipse cx="100" cy="60" rx="92" ry="52" fill="url(#chrome)"/>
	<ellipse cx="100" cy="60" rx="84" ry="45" fill="#111418"/>
	<ellipse cx="100" cy="60" rx="78" ry="40" fill="none" stroke="url(#chrome)" stroke-width="2"/>
	<text x="100" y="77" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="48" letter-spacing="2" fill="url(#chrome)">YP</text>
</svg>

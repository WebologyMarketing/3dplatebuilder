<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="1000" height="600">
	<!-- PB badge for the "On a car" view: replaces the car makers' logos. Black enamel oval, chrome rim and lettering. -->
	<defs>
		<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f4f5f6"/>
			<stop offset="0.5" stop-color="#8d939a"/>
			<stop offset="1" stop-color="#e6e8ea"/>
		</linearGradient>
	</defs>
	<ellipse cx="100" cy="60" rx="92" ry="52" fill="url(#chrome)"/>
	<ellipse cx="100" cy="60" rx="84" ry="45" fill="#111418"/>
	<ellipse cx="100" cy="60" rx="78" ry="40" fill="none" stroke="url(#chrome)" stroke-width="1.5"/>
	<text x="100" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="52" fill="url(#chrome)" letter-spacing="-2">PB</text>
</svg>
